  const d = stars[name];
  return (
    <header className="result-star" aria-label={`${name}星の診断結果`}>
      <p className="result-kicker">診断結果</p>

  );
}

function App() {
  const [phase, setPhase] = useState("intro");
  const [current, setCurrent] = useState(0);
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);

  const selectOption = (idx) => setAnswers((prev) => ({ ...prev, [current]: idx }));

  const goNext = () => {
    if (current < questions.length - 1) {
      setCurrent((c) => c + 1);
    } else {
      const scores = {};
      Object.keys(stars).forEach((s) => (scores[s] = 0));
      Object.entries(answers).forEach(([qi, ai]) => {
        const opt = questions[Number(qi)].options[ai];
        Object.entries(opt.scores).forEach(([s, v]) => { scores[s] = (scores[s] || 0) + v; });
      });
      const winner = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
      setResult(winner);
      setPhase("result");
    }
  };

  const goPrev = () => { if (current > 0) setCurrent((c) => c - 1); };
  const restart = () => { setCurrent(0); setAnswers({}); setResult(null); setPhase("quiz"); };
  const progress = Math.round(((current + 1) / questions.length) * 100);

  return (
    <div style={{ background:"#08182a", minHeight:"100vh", fontFamily:"'Noto Serif JP',serif", color:"#f5f1e9", padding:"0 0 4rem" }}>

        .moon { animation:moonGlow 4s ease-in-out infinite; display:inline-block; }
        .result-page { position:relative; isolation:isolate; width:min(100%,1000px); margin:0 auto; padding:3.5rem clamp(1.25rem,5vw,4.5rem) 5rem; overflow:hidden; background:#08182a; }
        .result-page::before { content:""; position:absolute; inset:0 0 auto; height:540px; z-index:-1; background:url("star-chart.webp") center 38%/cover no-repeat; opacity:.42; mix-blend-mode:screen; -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 100%); mask-image:linear-gradient(to bottom,#000 0%,#000 40%,transparent 100%); }
        .result-page::after { content:""; position:absolute; inset:0 0 auto; height:540px; z-index:-1; background:linear-gradient(90deg,rgba(8,24,42,.30),rgba(8,24,42,.12)); pointer-events:none; }
        .result-star { min-height:330px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; }
        .result-kicker { font-size:.82rem; letter-spacing:.28em; color:#ddbb84; margin:0 0 .5rem; }
        .result-star-mark { color:#ddbb84; font-size:1.05rem; line-height:1; margin:0 0 .55rem; }
        .result-name { font-family:'Shippori Mincho',serif; font-size:clamp(4rem,10vw,6.7rem); font-weight:400; letter-spacing:.1em; color:#f6dfb7; line-height:1.3; margin:0; text-shadow:0 2px 24px rgba(3,13,25,.48); }
        .result-name span { font-size:.66em; margin-left:.08em; }
        .result-type { font-size:clamp(1rem,2vw,1.35rem); letter-spacing:.09em; line-height:1.7; color:#f6dfb7; margin:.4rem 0 0; }
        .result-rows { position:relative; margin-top:1.8rem; border-top:1px solid rgba(221,187,132,.72); }
        .result-row { display:grid; grid-template-columns:32% 1fr; column-gap:2rem; padding:2.3rem .35rem; border-bottom:1px solid rgba(221,187,132,.56); }
        .result-label { font-family:'Shippori Mincho',serif; color:#f6dfb7; font-size:clamp(1.17rem,2vw,1.55rem); font-weight:400; letter-spacing:.08em; line-height:1.6; margin:0; }
        .result-row-content { border-left:1px solid rgba(221,187,132,.48); padding-left:2rem; }
        .result-text { color:#e3e5e4; font-size:.91rem; line-height:2.15; margin:0; }
        .result-list { margin:0; padding:0; list-style:none; display:grid; gap:.55rem; }
        .result-list li { color:#e3e5e4; font-size:.91rem; line-height:2.05; padding-left:1.45em; position:relative; }
        .result-list li::before { content:"✦"; position:absolute; left:0; color:#ddbb84; font-size:.6rem; top:.47em; }
        .result-note { color:#aebcc5; font-size:.76rem; line-height:1.9; text-align:center; margin:2.3rem auto 0; max-width:640px; }
        .result-cta { text-align:center; padding:2.3rem 1rem 0; }
        .result-cta p { color:#d0d8dc; font-size:.84rem; line-height:2; margin:0 0 1.35rem; }
        .result-cta .cta-btn { border-radius:40px; min-width:250px; }
        .result-retry { display:block; margin:1.7rem auto 0; background:none; border:0; border-bottom:1px solid rgba(221,187,132,.5); color:#ddbb84; padding:.25rem; font-family:inherit; cursor:pointer; }
        @media(max-width:650px) { .result-page { padding:2rem 1.2rem 3rem; } .result-page::before { height:420px; background-position:62% top; opacity:.36; } .result-star { min-height:285px; } .result-row { grid-template-columns:1fr; gap:.85rem; padding:1.8rem 0; } .result-row-content { border-left:0; padding-left:0; } .result-label { font-size:1.25rem; } }
        .diagnosis-intro { position:relative; isolation:isolate; overflow:hidden; width:100%; min-height:460px; margin:0; padding:4rem 1.25rem; background:#08182a; text-align:center; display:flex; align-items:center; justify-content:center; }
        .diagnosis-intro::before { content:""; position:absolute; inset:0; z-index:-1; background:url("star-chart.webp") center right/cover no-repeat; opacity:.75; mix-blend-mode:screen; -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 38%,#000 85%,transparent 100%); mask-image:linear-gradient(90deg,transparent 0%,#000 38%,#000 85%,transparent 100%); }
        .diagnosis-intro::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(8,24,42,.30),transparent 58%); pointer-events:none; }
        .diagnosis-intro-content { position:relative; z-index:1; }
        .diagnosis-intro-kicker { color:#ddbb84; font-size:.72rem; letter-spacing:.32em; margin:0 0 1.5rem; }
        .diagnosis-intro h1 { font-family:'Shippori Mincho',serif; font-size:clamp(2rem,4vw,3rem); font-weight:500; color:#f6dfb7; letter-spacing:.08em; margin:0; }
        .diagnosis-intro-rule { width:60px; height:1px; background:linear-gradient(to right,transparent,#ddbb84,transparent); margin:1.5rem auto; }
        .diagnosis-intro-lead { color:#d0d8dc; font-size:.88rem; line-height:2.4; margin:0 0 2.5rem; }
        @media(max-width:480px) { .diagnosis-intro { min-height:470px; margin:0; padding:3rem 1rem; } .diagnosis-intro-lead br { display:none; } }

      `}</style>

      {phase === "intro" && (
        <section className="diagnosis-intro fade-in" aria-labelledby="diagnosis-title">
          <div className="diagnosis-intro-content">
            <p className="diagnosis-intro-kicker">DIAGNOSIS</p>
            <h1 id="diagnosis-title">あなたの星タイプ診断</h1>
            <div className="diagnosis-intro-rule" />
            <p className="diagnosis-intro-lead">10の質問に答えて、紫微斗数14主星のあなたのタイプを診断します。<br/>表の顔と影の顔、両面でお伝えします。</p>
            <button type="button" className="nav-btn" onClick={() => setPhase("quiz")}>診断してみる →</button>
          </div>
        </section>
      )}

      <div style={{ maxWidth:phase === "result" ? 1100 : 640, margin:"0 auto", padding:phase === "result" ? "0" : "2.5rem 1.5rem" }}>
        {phase === "quiz" && (
          <div className="fade-in">
            <div style={{ marginBottom:"2rem" }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:"0.68rem", color:"#ddbb84", letterSpacing:"0.2em", marginBottom:"0.5rem" }}>
                <span>Q{current+1} / {questions.length}</span>
                <span>{progress}%</span>
              </div>
              <div style={{ height:2, background:"rgba(221,187,132,0.15)", borderRadius:1 }}>
                <div style={{ height:"100%", width:`${progress}%`, background:"linear-gradient(to right,#ddbb84,#f6dfb7)", borderRadius:1, transition:"width 0.4s ease" }}/>
              </div>
            </div>
            <div style={{ marginBottom:"2rem" }}>
              <div style={{ fontSize:"0.62rem", color:"#ddbb84", letterSpacing:"0.3em", marginBottom:"0.8rem" }}>QUESTION {String(current+1).padStart(2,"0")}</div>
              <div style={{ fontFamily:"'Shippori Mincho',serif", fontSize:"clamp(1rem,3vw,1.15rem)", color:"#f6dfb7", lineHeight:1.8, letterSpacing:"0.08em", marginBottom:"1.8rem" }}>{questions[current].text}</div>
              <div>
                {questions[current].options.map((opt,i) => (
                  <button key={i} className={`opt-btn${answers[current]===i?" selected":""}`} onClick={() => selectOption(i)}>
                    <span style={{ fontSize:"0.62rem", color:"#ddbb84", letterSpacing:"0.15em", minWidth:"1.2em", marginTop:"0.15em" }}>{LABELS[i]}</span>
                    <span>{opt.text}</span>
                  </button>
                ))}
              </div>
            </div>
            <div style={{ display:"flex", justifyContent:"space-between" }}>
              <button className="nav-btn" onClick={goPrev} disabled={current===0}>← 戻る</button>
              <button className="nav-btn" onClick={goNext} disabled={answers[current]===undefined}>
                {current===questions.length-1 ? "結果を見る ✨" : "次へ →"}
              </button>
            </div>
          </div>
        )}

        {phase === "result" && result && (
          <div className="result-page fade-in">
            <StarCard name={result}/>
            <div className="result-rows">
              <section className="result-row">
                <h3 className="result-label">あなたの星が<br/>示すもの</h3>
                <div className="result-row-content"><p className="result-text">{stars[result].desc}</p></div>
              </section>
              <section className="result-row">
                <h3 className="result-label">力が出る場面</h3>
                <div className="result-row-content"><ul className="result-list">{stars[result].light.map((item) => <li key={item}>{item}</li>)}</ul></div>
              </section>
              <section className="result-row">
                <h3 className="result-label">疲れたときに<br/>起こりやすいこと</h3>
                <div className="result-row-content"><p className="result-text">{stars[result].shadow}</p></div>
              </section>
              <section className="result-row">
                <h3 className="result-label">星の活かし方</h3>
                <div className="result-row-content"><p className="result-text">{stars[result].guide}</p></div>
              </section>
            </div>
            <p className="result-note">この診断は10の質問から見える傾向です。実際の命盤は出生時刻や各宮・星の配置も重ねて読み解きます。</p>
            <div className="result-cta">
              <p>ご自身の命盤を、もう少し詳しく知りたい方へ。</p>
              <a className="cta-btn" href="https://calendar.app.google/RKjr5zDFR9QqWDR69" target="_blank" rel="noreferrer">命盤を鑑定してもらう</a>
              <button className="result-retry" onClick={restart}>もう一度診断する</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
